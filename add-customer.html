<!DOCTYPE html>
<html>

<head>

<title>
Apex Arena - Add Customer
</title>


<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">


<nav class="bg-blue-700 text-white p-4">


<div class="max-w-6xl mx-auto flex flex-wrap justify-between">


<h1 class="font-bold text-xl">
🏋️ Apex Arena CRM
</h1>


<div class="flex gap-4">

<a href="dashboard.html">
Dashboard
</a>

<a href="customer.html">
Customers
</a>

</div>


</div>


</nav>




<div class="max-w-xl mx-auto p-4 sm:p-8">


<div class="bg-white rounded-2xl shadow-lg p-6">


<h2 class="text-2xl font-bold text-center text-blue-700">

Add New Customer

</h2>


<p class="text-center text-gray-500 mb-6">

Register gym member

</p>




<form id="customerForm">


<label>
Customer Name
</label>

<input

id="name"

required

class="w-full border rounded-lg p-3 mb-4"

placeholder="Enter name">


<label>
WhatsApp Number
</label>


<input

id="phone"

required

class="w-full border rounded-lg p-3 mb-4"

placeholder="9876543210">



<label>
Email
</label>


<input

id="email"

class="w-full border rounded-lg p-3 mb-4"

placeholder="Email address">



<label>
Membership Plan
</label>


<select

id="plan"

class="w-full border rounded-lg p-3 mb-4">


<option>
Monthly
</option>

<option>
3 Months
</option>

<option>
6 Months
</option>

<option>
Yearly
</option>


</select>




<label>
Amount Paid
</label>


<input

id="amount"

required

class="w-full border rounded-lg p-3 mb-5"

placeholder="800">



<button

class="w-full bg-blue-700 hover:bg-blue-800 text-white p-3 rounded-lg">


Save Customer


</button>



</form>


</div>


</div>



<script src="js/add-customer.js"></script>


</body>

</html>
