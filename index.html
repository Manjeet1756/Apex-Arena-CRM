<!DOCTYPE html>
<html>

<head>

<title>
Apex Arena CRM Login
</title>

<script src="https://cdn.tailwindcss.com"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


</head>


<body class="bg-blue-700 min-h-screen flex items-center justify-center px-4">


<div class="w-full max-w-sm">


<div class="text-center text-white mb-8">


<div class="text-6xl mb-4">
🏋️
</div>


<h1 class="text-3xl font-bold">
Apex Arena
</h1>


<p class="opacity-80">
Gym CRM
</p>


</div>




<div class="bg-white rounded-3xl shadow-xl p-6">


<h2 class="text-xl font-bold text-center mb-6">

Admin Login

</h2>



<form id="loginForm">


<input

id="email"

type="email"

placeholder="Email"

class="w-full border p-4 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-blue-600"
/>




<input

id="password"

type="password"

placeholder="Password"

class="w-full border p-4 rounded-xl mb-5 focus:outline-none focus:ring-2 focus:ring-blue-600"
/>




<button

class="w-full bg-blue-700 text-white p-4 rounded-xl font-semibold">

Login

</button>



</form>



<p id="error"
class="text-red-500 text-center mt-4">
</p>


</div>


</div>



<script src="js/login.js"></script>


</body>

</html>
