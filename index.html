<!DOCTYPE html>
<html>

<head>

<title>
Apex Arena CRM
</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">


<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-xl shadow">


<h1 class="text-2xl font-bold text-center">
🏋️ Apex Arena Gym
</h1>


<h2 class="text-center mt-2">
Add New Customer
</h2>


<form id="memberForm" class="mt-6">


<input 
id="name"
class="border p-3 w-full rounded mb-3"
placeholder="Customer Name"
/>


<input 
id="phone"
class="border p-3 w-full rounded mb-3"
placeholder="WhatsApp Number"
/>


<input 
id="email"
class="border p-3 w-full rounded mb-3"
placeholder="Email"
/>



<select 
id="plan"
class="border p-3 w-full rounded mb-3">

<option>
Monthly
</option>

<option>
3 Months
</option>

<option>
Yearly
</option>

</select>


<input 
id="amount"
class="border p-3 w-full rounded mb-3"
placeholder="Amount"
/>


<button 
class="bg-blue-600 text-white w-full p-3 rounded">

Save Customer

</button>


</form>


</div>



<script src="js/app.js"></script>

</body>

</html>
