<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Customer | Apex Arena CRM</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100">

    <!-- Mobile Header -->
    <header class="lg:hidden sticky top-0 z-40 bg-white shadow">

        <div class="flex items-center justify-between px-5 py-4">

            <div class="flex items-center gap-3">

                <a href="dashboard.html"
                    class="text-2xl">

                    ←

                </a>

                <div>

                    <h1 class="text-xl font-bold">

                        Add Customer

                    </h1>

                    <p class="text-sm text-gray-500">

                        Apex Arena Gym

                    </p>

                </div>

            </div>

        </div>

    </header>

    <!-- Desktop Navbar -->
    <nav class="hidden lg:block bg-blue-700 text-white shadow">

        <div class="max-w-7xl mx-auto px-8 py-5 flex justify-between items-center">

           <div class="flex items-center gap-4">



    <img
        src="assets/apex-img.jpg"
        alt="Apex Arena Logo"
        class="w-14 h-14 rounded-full bg-white shadow-md flex items-center justify-center overflow-hidden">




<h1 class="text-white font-bold text-xl">

Apex Arena

</h1>





</div>


            <div class="flex gap-8 text-lg">

                <a href="dashboard.html" class="hover:text-blue-200">

                    Dashboard

                </a>

                <a href="customers.html" class="hover:text-blue-200">

                    Customers

                </a>

            </div>

        </div>

    </nav>

    <!-- Main -->

    <main class="max-w-2xl mx-auto px-4 py-6 lg:py-10">

        <div class="bg-white rounded-3xl shadow-xl p-6 sm:p-8">


            <form id="customerForm" class="space-y-6">

                <div>

                    <label class="block font-medium mb-2">

                        Customer Name

                    </label>

                    <input
                        id="name"
                        required
                        type="text"
                        placeholder="Enter full name"
                        class="w-full h-14 rounded-2xl border border-gray-300 px-5 text-lg focus:outline-none focus:ring-2 focus:ring-blue-600">

                </div>

                <div>

                    <label class="block font-medium mb-2">

                        WhatsApp Number

                    </label>

                    <input
                        id="phone"
                        required
                        type="tel"
                        placeholder="9876543210"
                        class="w-full h-14 rounded-2xl border border-gray-300 px-5 text-lg focus:outline-none focus:ring-2 focus:ring-blue-600">

                </div>

                <div>

                    <label class="block font-medium mb-2">

                        Email Address

                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="customer@email.com"
                        class="w-full h-14 rounded-2xl border border-gray-300 px-5 text-lg focus:outline-none focus:ring-2 focus:ring-blue-600">

                </div>

                <div>

                    <label class="block font-medium mb-2">

                        Membership Plan

                    </label>

                    <select
                        id="plan"
                        class="w-full h-14 rounded-2xl border border-gray-300 px-5 text-lg focus:outline-none focus:ring-2 focus:ring-blue-600">

                        <option>Monthly</option>
                        <option>3 Months</option>
                        <option>6 Months</option>
                        <option>Yearly</option>

                    </select>

                </div>

                <div>

                    <label class="block font-medium mb-2">

                        Amount Paid (₹)

                    </label>

                    <input
                        id="amount"
                        required
                        type="number"
                        placeholder="800"
                        class="w-full h-14 rounded-2xl border border-gray-300 px-5 text-lg focus:outline-none focus:ring-2 focus:ring-blue-600">

                </div>

                <!-- Desktop Button -->

               <button
            form="customerForm"
            class="w-full h-14 bg-blue-700 text-white rounded-2xl text-lg font-semibold">

            Save Customer

        </button>

            </form>

        </div>

    </main>

    

    <script src="js/add-customer.js"></script>

</body>

</html>
