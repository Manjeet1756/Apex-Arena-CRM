<!DOCTYPE html>
<html>

<head>

<title>Apex Arena CRM Login</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">


<div class="bg-white w-full max-w-md p-6 sm:p-8 rounded-xl shadow">


<div class="text-center mb-6">


<h1 class="text-2xl sm:text-3xl font-bold text-blue-700">

🏋️ Apex Arena Gym

</h1>


<p class="text-gray-500 mt-2">

Admin Panel Login

</p>


</div>


<form id="loginForm">


<input

id="email"

type="email"

placeholder="Admin Email"

class="w-full border p-3 rounded mb-4"
/>



<input

id="password"

type="password"

placeholder="Password"

class="w-full border p-3 rounded mb-4"
/>




<button

class="w-full bg-blue-700 text-white p-3 rounded hover:bg-blue-800">

Login

</button>


</form>



<p id="error"
class="text-red-500 text-center mt-4">

</p>



</div>



<script src="js/login.js"></script>


</body>

</html>
